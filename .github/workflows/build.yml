name: Build Instance Images

# Builds every image docker-bake.hcl defines, one job per image and platform on
# native runners, and runs the required-tools, version and smoke checks.
#
# Pull requests (Renovate's included) and branches build and check everything
# and publish nothing. On main, only the images whose inputs changed since
# they were last published are rebuilt; they are pushed with an SBOM and
# provenance, signed with cosign (keyless, this workflow's OIDC identity), and
# the ClusterImageCatalog manifests in catalogs/ are regenerated.
#
# See design/001-image-supply-chain.md.

on:
  push:
    branches:
    - main
    paths-ignore:
    - catalogs/**
    - design/**
    - '**.md'
    - renovate.json
  pull_request:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and republish every image, even those already published with the same inputs
        type: boolean
        default: false

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a publish halfway through; superseded PR builds can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      publishing: ${{ steps.plan.outputs.publishing }}
      prefix: ${{ steps.plan.outputs.prefix }}
      build-id: ${{ steps.plan.outputs.build-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Work out what to build
      id: plan
      env:
        EVENT: ${{ github.event_name }}
        FORCE: ${{ inputs.force }}
      run: |
        prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
        publishing=false
        if [ "${GITHUB_REF}" = refs/heads/main ] && [ "${EVENT}" != pull_request ]; then
          publishing=true
        fi
        # Only a publishing run skips images whose inputs are already
        # published; everything else checks the whole matrix.
        flags=--all
        if [ "${publishing}" = true ] && [ "${FORCE}" != true ]; then
          flags=
        fi
        plan="$(IMAGE_PREFIX="${prefix}" images/plan.sh ${flags})"
        {
          echo "build=$(jq -c .build <<<"${plan}")"
          echo "publish=$(jq -c .publish <<<"${plan}")"
          echo "publishing=${publishing}"
          echo "prefix=${prefix}"
          echo "build-id=$(date -u +%Y%m%d%H%M)"
        } >>"${GITHUB_OUTPUT}"
        {
          echo "### Plan (publishing: ${publishing})"
          jq -r '.publish[] | "- \(.target)"' <<<"${plan}"
        } >>"${GITHUB_STEP_SUMMARY}"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.prefix }}
      BUILD_ID: ${{ needs.plan.outputs.build-id }}
      REVISION: ${{ github.sha }}
      PUBLISHING: ${{ needs.plan.outputs.publishing }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Log in to GHCR
      if: needs.plan.outputs.publishing == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build, check and smoke test${{ needs.plan.outputs.publishing == 'true' && ', then push by digest' || '' }}
      env:
        TARGET: ${{ matrix.target }}
        PLATFORM: ${{ matrix.platform }}
      run: |
        push=
        [ "${PUBLISHING}" = true ] && push=--push
        images/build.sh --platform "${PLATFORM}" ${push} "${TARGET}"

    - name: Scan for vulnerabilities
      # Informational: the report lands in the job summary and never fails the
      # build. Fixes come from the base-image and package bumps Renovate opens.
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: cnmsql-build/${{ matrix.target }}:linux-${{ matrix.arch }}
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        format: table
        output: trivy.txt
        exit-code: '0'

    - name: Add the scan to the summary
      run: |
        {
          echo "### ${{ matrix.name }}: fixable HIGH/CRITICAL vulnerabilities"
          echo '```'
          cat trivy.txt
          echo '```'
        } >>"${GITHUB_STEP_SUMMARY}"

    - name: Upload digest
      if: needs.plan.outputs.publishing == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digests-${{ matrix.target }}-${{ matrix.arch }}
        path: digests/*
        if-no-files-found: error
        retention-days: 1

  publish:
    name: Publish ${{ matrix.name }}
    needs: [plan, build]
    # Publish every image whose platforms all built, even when another image
    # failed; publish.sh refuses an image with a missing platform.
    if: ${{ !cancelled() && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.publish) }}
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.prefix }}
      BUILD_ID: ${{ needs.plan.outputs.build-id }}
      REVISION: ${{ github.sha }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: digests-${{ matrix.target }}-*
        path: digests
        merge-multiple: true

    - name: Create the multi-platform image, tag and sign it
      run: images/publish.sh "${{ matrix.target }}" | tee -a "${GITHUB_STEP_SUMMARY}"

  catalogs:
    name: Update catalogs
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      IMAGE_PREFIX: ${{ needs.plan.outputs.prefix }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Pushes the regenerated catalogs back to main.
        persist-credentials: true

    - name: Regenerate and commit the catalogs
      run: |
        images/catalog.sh
        git add catalogs
        if git diff --cached --quiet; then
          echo "Catalogs unchanged."
          exit 0
        fi
        git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: update image catalogs"
        # Another run may have pushed meanwhile; catalogs/ is only written here.
        for _ in 1 2 3; do
          git pull --rebase origin main && git push origin HEAD:main && exit 0
          sleep 5
        done
        exit 1
